name: CI

on:
  pull_request:
  push:

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: tianon/actions/checkout/composite@581498642ee39d41dc3a801d22b3f7f42a95acc7 # HEAD
      - run: ./build.sh
      - run: ./artifacts/gosleep-amd64 --for 5s
      - run: ./artifacts/gosleep-i386 --for 5s
